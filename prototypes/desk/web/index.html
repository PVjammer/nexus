<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">Nexus <span class="proto">prototype</span></div>
    <nav id="tabs"></nav>
    <div class="spacer"></div>
    <div id="toolbar"></div>
    <div id="running"></div>
    <div id="needs-pill"></div>
    <button id="chats-btn" title="Every conversation with an agent">Chats</button>
    <button id="customizer-btn" title="Change how Nexus looks (Ctrl+.)"></button>
    <div id="apps-slot"></div>
    <button id="capture-btn" title="Capture a thought (Ctrl+Shift+Space)">+ Capture</button>
  </header>
  <main id="main">
    <section id="home-view">
      <div id="home"></div>
    </section>
    <section id="project-view" hidden>
      <aside id="rail"></aside>
      <section id="workspace">
        <div id="layout"></div>
        <div id="pane-layer"></div>
        <div id="drop-hint" hidden></div>
      </section>
      <aside id="project-chat-slot" class="chat-slot"></aside>
    </section>
  </main>
  <div id="chats-root"></div>
  <div id="work-app"></div>
  <div id="work-drawer"></div>
  <div id="customizer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
